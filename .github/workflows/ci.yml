name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  langchain-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LangChain conformance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph]" -e plugins/agentbridge-langchain
      - name: Run LangChain and remote transport conformance
        run: python -m pytest -q plugins/agentbridge-langchain/tests
      - name: Run offline streaming, approval, and evaluation examples
        run: |
          python examples/remote_graph_stream.py --async --max-events 2
          python examples/remote_graph_approval.py
          python examples/langfuse_typed_evaluation.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph,pydantic-ai]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test CLI
        run: |
          agentbridge list-backends
          agentbridge versions --json
          agentbridge validate --manifest examples/refund_agent.yaml --backend mock --backend langgraph --json
          agentbridge capability-matrix --backend mock --markdown
          agentbridge extensions crewai --json

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Build CrewAI plugin package
        run: |
          python -m build plugins/agentbridge-crewai --outdir dist-crewai
          python -m twine check dist-crewai/*
