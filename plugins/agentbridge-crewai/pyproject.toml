[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbridge-crewai"
version = "0.1.0"
description = "CrewAI adapter plugin for AgentBridge."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "agentbridge>=0.1.0",
  "crewai>=0.11.2,<0.12",
]

[project.entry-points."agentbridge.adapters"]
crewai = "agentbridge_crewai.adapter:CrewAIAdapter"

[tool.hatch.build.targets.wheel]
packages = ["agentbridge_crewai"]
