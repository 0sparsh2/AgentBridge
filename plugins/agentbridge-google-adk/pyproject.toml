[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbridge-google-adk"
version = "0.1.0"
description = "AgentBridge adapter plugin for google_adk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "agentbridge>=0.1.0",
  "google-adk>=2.9,<3",
]

[project.entry-points."agentbridge.adapters"]
google_adk = "agentbridge_google_adk.adapter:Adapter"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
