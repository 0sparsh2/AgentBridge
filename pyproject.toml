[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbridge"
version = "0.1.0"
description = "Define an agent once and run it across multiple agent frameworks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentBridge contributors" }]
keywords = ["agents", "langgraph", "pydantic-ai", "crewai", "agent-frameworks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.13,<3",
  "litellm>=1.100,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.11,<2"]
pydantic-ai = ["pydantic-ai-slim>=2.42,<3"]
all = [
  "langgraph>=1.2.11,<2",
  "pydantic-ai-slim>=2.42,<3",
]
dev = [
  "build>=1.2",
  "mkdocs-material>=9.5",
  "pytest>=8.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/0sparsh2/agent-framework-connector"
Repository = "https://github.com/0sparsh2/agent-framework-connector"
Issues = "https://github.com/0sparsh2/agent-framework-connector/issues"
Documentation = "https://agentbridge.readthedocs.io/en/latest/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
